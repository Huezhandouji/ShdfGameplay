# 语言文件(简体中文):ShdfGameplay 全部玩家可见文案与日志/异常文案的唯一来源,
# 经 com.shdfGameplay.lang.Lang 装填——玩家可见文本 Lang.render("键") / 日志与异常 Lang.plain("键")。
# 键为顶层点分键(每行一个,不嵌套),分组只用注释行;样式标签(MiniMessage 语法)直接写在模板里,如 <red>…</red>。
# 命名占位符在模板内写作 <占位名> 标签,调用侧经 Placeholder.unparsed("占位名", 值) 注入;
# 玩家名/地图名等运行期值严禁字符串拼进模板(防 MiniMessage 注入);字面 "<" 写作 "\<"。
# 本文件随 jar 分发,首启由 DefaultResources 释放到 plugins/ShdfGameplay/lang/;
# 数据目录同名文件逐键覆盖在本文件之上(老安装缺新键自动回退 jar 默认,改过就保得住)。
# 来源:i18n 基建(第 1 轮)——模板文本与颜色已逐字对照既有源码核实,不得顺手改样式。

